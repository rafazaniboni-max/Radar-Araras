name: Publicar a última versão boa

on:
  workflow_dispatch:

concurrency:
  group: radar-araras-producao
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Conferir os arquivos de referência
        run: python scripts/testar-validacao.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar a versão boa já existente
        id: publicacao
        uses: actions/deploy-pages@v4
      - name: Atualizar a versão de referência para a Hostinger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin codex/site-publicado
          radar_hostinger_base=$(git rev-parse FETCH_HEAD)
          radar_hostinger_arvore=$(git rev-parse HEAD:dist)
          if [ "$radar_hostinger_arvore" != "$(git rev-parse "$radar_hostinger_base^{tree}")" ]; then
            radar_hostinger_commit=$(git commit-tree "$radar_hostinger_arvore" -p "$radar_hostinger_base" -m 'Publicar a versão de referência conferida na Hostinger')
            git push origin "$radar_hostinger_commit:refs/heads/codex/site-publicado"
          fi
