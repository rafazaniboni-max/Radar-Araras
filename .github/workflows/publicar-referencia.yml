name: Publicar a última versão boa

on:
  workflow_dispatch:

concurrency:
  group: radar-araras-producao
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Conferir os arquivos de referência
        run: python scripts/testar-validacao.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar a versão boa já existente
        id: publicacao
        uses: actions/deploy-pages@v4
