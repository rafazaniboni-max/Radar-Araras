name: Coletar, validar e publicar o Radar Araras

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
      timezone: America/Sao_Paulo
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
      - 'auditoria-*.md'

concurrency:
  group: radar-araras-producao
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Instalar bibliotecas de leitura das fontes oficiais
        run: python -m pip install -r requirements.txt
      - name: Testar o bloqueio de coletas inválidas
        run: |
          python scripts/testar-validacao.py
          python scripts/testar-historico.py
      - name: Coletar novamente e validar contra a última versão boa
        run: python -u scripts/atualizar-site.py
      - name: Guardar o relatório da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-da-coleta
          path: |
            .build/atualizacao/relatorio.json
            .build/atualizacao/raw/atas/diagnostico.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Configurar a publicação
        uses: actions/configure-pages@v5
      - name: Preparar somente a versão validada
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/atualizacao/dist
      - name: Publicar a versão validada
        id: publicacao
        uses: actions/deploy-pages@v4
      - name: Guardar a nova referência validada no repositório
        run: |
          python scripts/promover-atualizacao.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'Atualizar os dados oficiais após coleta e publicação validadas' || test -z "$(git status --porcelain dist)"
          git push origin HEAD:main
      - name: Atualizar somente a versão aprovada para a Hostinger
        run: |
          git fetch origin codex/site-publicado
          radar_hostinger_base=$(git rev-parse FETCH_HEAD)
          radar_hostinger_arvore=$(git rev-parse HEAD:dist)
          if [ "$radar_hostinger_arvore" != "$(git rev-parse "$radar_hostinger_base^{tree}")" ]; then
            radar_hostinger_commit=$(git commit-tree "$radar_hostinger_arvore" -p "$radar_hostinger_base" -m 'Publicar os dados oficiais conferidos na Hostinger')
            git push origin "$radar_hostinger_commit:refs/heads/codex/site-publicado"
          fi
